<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ffcc44" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#b8860b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1208" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>

  <!-- Warm black backdrop -->
  <rect width="512" height="512" fill="#0a0806"/>

  <!-- Outer amber halo -->
  <circle cx="256" cy="256" r="240" fill="url(#halo)"/>

  <!-- === OUTER RING LAYER === -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.2">
    <circle cx="256" cy="256" r="235"/>
    <circle cx="256" cy="256" r="225" stroke-width="0.6" stroke-dasharray="1 4"/>
    <circle cx="256" cy="256" r="210" stroke-width="2"/>
  </g>

  <!-- === RUNIC TICKS AROUND OUTER RING === -->
  <g stroke="#f5d76e" stroke-width="2">
    <!-- Cardinal ticks (longer) -->
    <line x1="256" y1="21"  x2="256" y2="46"/>
    <line x1="256" y1="466" x2="256" y2="491"/>
    <line x1="21"  y1="256" x2="46"  y2="256"/>
    <line x1="466" y1="256" x2="491" y2="256"/>
    <!-- Diagonal ticks -->
    <line x1="93"  y1="93"  x2="110" y2="110"/>
    <line x1="402" y1="402" x2="419" y2="419"/>
    <line x1="93"  y1="419" x2="110" y2="402"/>
    <line x1="419" y1="93"  x2="402" y2="110"/>
  </g>

  <!-- Dense small ticks around ring (36 ticks, every 10 degrees) -->
  <g stroke="#c9a227" stroke-width="1">
    <g transform="translate(256 256)">
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(0)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(10)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(20)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(30)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(40)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(50)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(60)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(70)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(80)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(90)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(100)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(110)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(120)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(130)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(140)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(150)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(160)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(170)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(180)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(190)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(200)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(210)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(220)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(230)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(240)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(250)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(260)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(270)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(280)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(290)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(300)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(310)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(320)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(330)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(340)"/>
      <line x1="0" y1="-222" x2="0" y2="-232" transform="rotate(350)"/>
    </g>
  </g>

  <!-- === MIDDLE RING === -->
  <g fill="none" stroke="#f5d76e" stroke-width="1">
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="170" stroke-width="0.6" stroke-dasharray="2 6"/>
  </g>

  <!-- === INNER ROTATED SQUARE (sacred geometry) === -->
  <g fill="none" stroke="#ffcc44" stroke-width="2" opacity="0.95">
    <rect x="126" y="126" width="260" height="260" transform="rotate(45 256 256)"/>
    <rect x="150" y="150" width="212" height="212" transform="rotate(45 256 256)" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- === INNER RING (binding circle) === -->
  <g fill="none" stroke="#d4af37" stroke-width="1.2">
    <circle cx="256" cy="256" r="135"/>
    <circle cx="256" cy="256" r="120" stroke-width="0.8" stroke-dasharray="1 3"/>
  </g>

  <!-- === RADIAL SPOKES (16 rays) === -->
  <g stroke="#c9a227" stroke-width="0.8" opacity="0.8">
    <g transform="translate(256 256)">
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(0)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(22.5)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(45)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(67.5)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(90)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(112.5)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(135)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(157.5)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(180)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(202.5)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(225)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(247.5)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(270)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(292.5)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(315)"/>
      <line x1="0" y1="-120" x2="0" y2="-135" transform="rotate(337.5)"/>
    </g>
  </g>

  <!-- === GLOWING CORE === -->
  <circle cx="256" cy="256" r="100" fill="url(#core)" opacity="0.45"/>

  <!-- === CENTER EMBLEM — CROSS OF WISDOM === -->
  <g stroke="#fff3c4" stroke-width="3" stroke-linecap="round">
    <!-- Vertical beam -->
    <line x1="256" y1="180" x2="256" y2="332"/>
    <!-- Horizontal beam -->
    <line x1="180" y1="256" x2="332" y2="256"/>
  </g>

  <!-- Center diamond -->
  <g transform="translate(256 256) rotate(45)">
    <rect x="-22" y="-22" width="44" height="44"
          fill="#ffcc44" stroke="#fff3c4" stroke-width="2"/>
    <rect x="-12" y="-12" width="24" height="24"
          fill="#0a0806" stroke="#f5d76e" stroke-width="1"/>
  </g>

  <!-- === PULSING DOT IN CENTER === -->
  <circle cx="256" cy="256" r="6" fill="#fff3c4"/>

  <!-- === TINY STARS AT CARDINAL POINTS === -->
  <g fill="#f5d76e">
    <circle cx="256" cy="90"  r="3"/>
    <circle cx="256" cy="422" r="3"/>
    <circle cx="90"  cy="256" r="3"/>
    <circle cx="422" cy="256" r="3"/>
  </g>
</svg>